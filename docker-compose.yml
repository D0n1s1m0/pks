services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carsharing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - carsharing-postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carsharing"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  carsharing-postgres-data:
